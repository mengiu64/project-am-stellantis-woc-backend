name: Code Scanning (CodeQL)

on:
  push:
    branches: ["develop", "staging", "production"]
  pull_request:
    branches: ["develop", "staging", "production"]
  schedule:
    # Ogni lunedì alle 07:00 Europe/Rome (05:00 UTC)
    - cron: "0 5 * * 1"

jobs:
  analyze:
    name: CodeQL — ${{ matrix.module }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        module:
          - agendaSoa
          - agendaSoaNaga
          - dms
          - jobcard
          - v360
          - pkEper
          - pkDocsoa
          - pkMenupricing

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Analizza solo il codice del modulo corrente
          config: |
            paths:
              - ${{ matrix.module }}
            paths-ignore:
              - ${{ matrix.module }}/node_modules
              - ${{ matrix.module }}/__tests__
              - ${{ matrix.module }}/coverage

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript/module:${{ matrix.module }}"
