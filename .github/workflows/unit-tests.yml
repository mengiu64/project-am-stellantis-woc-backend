          node-version: "24"
          cache: "npm"
          cache-dependency-path: dbManager/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security scan
        run: |
          mkdir -p coverage
          npm audit --json > coverage/audit-report.json 2>&1 || true
