        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: v360/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security scan
        run: |
          mkdir -p coverage
          npm audit --json > coverage/audit-report.json 2>&1 || true
          npm audit --audit-level=high && touch .scan-ok || true
      - name: Run tests with coverage (≥90%)
        run: npm run test:coverage -- --verbose
      - name: Generate artifact dashboard
        if: always()
        run: |
