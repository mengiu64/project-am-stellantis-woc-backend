            }
            const files = Object.entries(s).filter(([k])=>k!=='total');
            if (files.length) {
              console.log('');
              console.log('<details><summary>📁 Dettaglio per file</summary>');
              console.log('');
              console.log('| File | Stmt | Branch | Func | Lines |');
              console.log('|---|---|---|---|---|');
              for (const [file,m] of files) {
                const name = file.split('/').pop();
