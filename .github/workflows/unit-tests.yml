          const html=`<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CI Report - ${mod}</title><style>${css}</style></head><body><h1>CI Report — ${mod}</h1><p class="meta">Generato il ${now} &nbsp;|&nbsp; <a href="test-report.html">📋 Test completo</a> &nbsp;|&nbsp; <a href="lcov-report/index.html">🔍 Line coverage</a></p>${secHtml}${testHtml}${covHtml}</body></html>`;
          fs.mkdirSync('./coverage',{recursive:true});
          fs.writeFileSync('./coverage/index.html',html);
