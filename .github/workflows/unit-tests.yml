name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-agendaSoa:
    name: agendaSoa
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agendaSoa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agendaSoa/package-lock.json
      - run: npm ci
      - run: npm test

  test-agendaSoaNaga:
    name: agendaSoaNaga
    runs-on: ubuntu-latest
