          if(audit){
            const v=audit.metadata?.vulnerabilities||{};
            const hc=(v.high||0)+(v.critical||0);
            const total=(v.info||0)+(v.low||0)+(v.moderate||0)+hc;
            const badge=hc>0?'<span class="badge err">VULNERABILITA</span>':total>0?'<span class="badge warn">ATTENZIONE</span>':'<span class="badge ok">OK</span>';
            const sevRows=[['critical','🔴','Critical'],['high','🟠','High'],['moderate','🟡','Moderate'],['low','🟢','Low'],['info','ℹ️','Info']].filter(([k])=>v[k]).map(([k,,l])=>`<tr><td>${l}</td><td><b>${v[k]}</b></td></tr>`).join('');
            const highs=Object.values(audit.vulnerabilities||{}).filter(p=>['high','critical'].includes(p.severity));
            const vrows=highs.map(p=>{const via=(p.via||[]).map(x=>typeof x==='string'?x:(x.title||x.name||'?')).join(', ');const fix=p.fixAvailable===true?'<span class="ok">si</span>':p.fixAvailable?.name?`<span class="warn">breaking: ${p.fixAvailable.name}</span>`:'<span class="err">no</span>';return`<tr><td><code>${p.name}</code></td><td class="err">${p.severity}</td><td>${via}</td><td>${fix}</td></tr>`;}).join('');
            const vdet=highs.length?`<details><summary>Dettaglio high/critical (${highs.length})</summary><table><tr><th>Package</th><th>Severity</th><th>Problema</th><th>Fix</th></tr>${vrows}</table></details>`:'';
            secHtml=`<div class="card"><h2>🔒 Security Scan ${badge}</h2>${sevRows?`<table><tr><th>Severity</th><th>Count</th></tr>${sevRows}</table>`:'<p class="ok">Nessuna vulnerabilita trovata</p>'}${vdet}</div>`;
