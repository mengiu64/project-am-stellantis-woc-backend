name: Unit Tests & Security Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-agendaSoa:
    name: agendaSoa
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agendaSoa
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: agendaSoa/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security scan
        run: npm audit --audit-level=high
      - name: Run tests with coverage (≥90%)
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-agendaSoa
          path: agendaSoa/coverage/
          retention-days: 30

  test-agendaSoaNaga:
    name: agendaSoaNaga
