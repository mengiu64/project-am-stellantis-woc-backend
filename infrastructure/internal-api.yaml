# Non modifica API policy, VPC endpoint o stage preesistenti. Non contiene un Deployment.
# Prerequisito: il resource Allow con Principal "*" deve coprire solo /api e /auth,
# mai /internal. Per /internal l'Allow deriva dalle policy dei ruoli nello stesso
# account; un Deny globale fuori aws:SourceVpce mantiene l'API privata.
AWSTemplateFormatVersion: '2010-09-09'
Description: 'WOC REST interno IAM: rotte e permessi su API privata esistente. Applicazione e deployment stage a cura del team infrastruttura.'
Parameters:
  Environment:
    Type: String
    AllowedValues:
    - dev
    - stage
    - prod
  RestApiId:
    Type: String
    Description: REST API privato preesistente; nessuna creazione di API/stage
  RootResourceId:
    Type: String
    Description: Resource id del path / del REST API
  StageName:
    Type: String
    Default: wia
  PkManagerRoleName:
    Type: String
    Description: Nome (non ARN) del ruolo execution della Lambda PkManager
  PkFavoriteRoleName:
    Type: String
    Description: Nome (non ARN) del ruolo execution della Lambda PkFavorite
  DmsRoleName:
    Type: String
    Description: Nome (non ARN) del ruolo execution della Lambda Dms
  JobCardRoleName:
    Type: String
    Description: Nome (non ARN) del ruolo execution della Lambda JobCard
  DjcRoleName:
    Type: String
    Description: Nome (non ARN) del ruolo execution della Lambda Djc
  SessionRoleName:
    Type: String
    Description: Nome (non ARN) del ruolo execution della Lambda Session
  HqManagerRoleName:
    Type: String
    Description: Nome (non ARN) del ruolo execution della Lambda HqManager
  DmlConfigSyncRoleName:
    Type: String
    Description: Nome (non ARN) del ruolo execution della Lambda DmlConfigSync
  SynchStatusRoleName:
    Type: String
    Description: Nome (non ARN) del ruolo execution della Lambda SynchStatus
Resources:
  InternalConfigSecretReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        Fn::Sub: woc-${Environment}-internal-api-config-read
      Roles:
        - Ref: PkManagerRoleName
        - Ref: PkFavoriteRoleName
        - Ref: DmsRoleName
        - Ref: JobCardRoleName
        - Ref: DjcRoleName
        - Ref: SessionRoleName
        - Ref: HqManagerRoleName
        - Ref: DmlConfigSyncRoleName
        - Ref: SynchStatusRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sm-np-bsn0027990-${Environment}-internal-api-config-*
  InternalRoot:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: RestApiId
      ParentId:
        Ref: RootResourceId
      PathPart: internal
  DmsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: RestApiId
      ParentId:
        Ref: InternalRoot
      PathPart: dms
  DmsOperation:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: RestApiId
      ParentId:
        Ref: DmsResource
      PathPart: '{operation}'
  DmsPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: RestApiId
      ResourceId:
        Ref: DmsOperation
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      ApiKeyRequired: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:lmb-np-bsn0027990-${Environment}-dms/invocations
        TimeoutInMillis: 29000
  DmsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:lmb-np-bsn0027990-${Environment}-dms
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
      SourceArn:
        Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/${StageName}/POST/internal/dms/*
