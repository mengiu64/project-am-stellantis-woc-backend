      CodeUri: srpV360Ota/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub
                  - "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPath}"
                  - ParamPath: !If [IsProd, "/app/BSN0027990/SRP_V360_OTA", !Sub "/app/np-BSN0027990-${Environment}/SRP_V360_OTA"]
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: "*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
        # srpV360Ota/dynamoCache.js — cache del token OAuth2 PingFederate su
