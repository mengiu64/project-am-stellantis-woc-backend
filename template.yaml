AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

# Template CloudFormation per Lambda synch-status
# Naming convention: aggiungi suffix -dev/-stage al name, nessun suffix per produzione

Description: |
  Stellantis WOC - synch-status Lambda
  REST API per sincronizzazione eventi Kafka da SRP Digital Layer a DJC/GCT

Parameters:
  Env:
    Type: String
    Description: Environment (dev, stage, produzione)
    AllowedValues:
      - dev
      - stage
      - produzione
    Default: dev

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Env
        LOG_LEVEL: !If [IsProd, 'warn', 'info']

Conditions:
  IsProd: !Equals [!Ref Env, 'produzione']
  IsStage: !Equals [!Ref Env, 'stage']
  IsDev: !Equals [!Ref Env, 'dev']

Resources:
  # ==========================================
  # IAM Role per Lambda (stessi permessi di isStellantisBrand)
  # ==========================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'stellantis-synch-status-role-${Env}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:!Sub '${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        # Politica: accesso Parameter Store
        - PolicyName: ParameterStoreAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/stellantis/synch-status/*'
        
        # Politica: accesso Secrets Manager
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stellantis/synch-status/*'
        
        # Politica: accesso CloudWatch Logs
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/stellantis-synch-status-*'
        
        # Politica: accesso X-Ray (per distributed tracing)
        - PolicyName: XRayAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  # ==========================================
  # Lambda Function
  # ==========================================
  SynchStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Nome con suffix environment (per naming convention)
      FunctionName: !If
        - IsProd
        - stellantis-synch-status
        - !Sub 'stellantis-synch-status-${Env}'
      
      # Handler entrypoint - punta al file index.js della lambda nella directory synch-status
      CodeUri: synch-status
      Handler: index.handler
      
      # Role IAM
      Role: !GetAtt LambdaExecutionRole.Arn
      
      # Environment variables
      Environment:
        Variables:
          # AWS Region
          AWS_REGION: !Sub '${AWS::Region}'
          AWS_PARTITION: !Sub '${AWS::Partition}'
          
          # OAuth2 configuration (da Parameter Store)
          OAUTH_CLIENT_ID: !Sub
            - '{{resolve:ssm:/stellantis/synch-status/oauth-client-id${EnvSuffix}:1}}'
            - EnvSuffix: !If [IsProd, '', !Sub '-${Env}']
          
          OAUTH_TOKEN_URL: !Sub
            - '{{resolve:ssm:/stellantis/synch-status/oauth-token-url${EnvSuffix}:1}}'
            - EnvSuffix: !If [IsProd, '', !Sub '-${Env}']
          
          # IBM API Connect configuration - Client ID per identificare consumer
          IBM_APIC_CLIENT_ID: !Sub
            - '{{resolve:ssm:/stellantis/synch-status/apic-client-id${EnvSuffix}:1}}'
            - EnvSuffix: !If [IsProd, '', !Sub '-${Env}']
          
          # IBM API Connect client secret - CRITICO per autenticazione APIC (FIX)
          IBM_APIC_CLIENT_SECRET: !Sub
            - '{{resolve:ssm:/stellantis/synch-status/apic-client-secret${EnvSuffix}:1}}'
            - EnvSuffix: !If [IsProd, '', !Sub '-${Env}']
          
          IBM_APIC_URL: !Sub
            - '{{resolve:ssm:/stellantis/synch-status/apic-url${EnvSuffix}:1}}'
            - EnvSuffix: !If [IsProd, '', !Sub '-${Env}']
          
          # External systems endpoints
          DJC_ENDPOINT: !Sub
            - '{{resolve:ssm:/stellantis/synch-status/djc-endpoint${EnvSuffix}:1}}'
            - EnvSuffix: !If [IsProd, '', !Sub '-${Env}']
          
          GCT_ENDPOINT: !Sub
            - '{{resolve:ssm:/stellantis/synch-status/gct-endpoint${EnvSuffix}:1}}'
            - EnvSuffix: !If [IsProd, '', !Sub '-${Env}']
      
      # CloudWatch Logs
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Sub '/aws/lambda/stellantis-synch-status-${Env}'
      
      # Tracing config (X-Ray)
      TracingConfig:
        Mode: Active
      
      # Reserved concurrent executions
      ReservedConcurrentExecutions: !If [IsProd, 100, 10]
      
      # API Gateway integration
      Events:
        PostSynchStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/synch-status
            Method: POST
            Auth:
              Authorizer: NONE
        
        GetSynchStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/synch-status/{requestId}
            Method: GET
            Auth:
              Authorizer: NONE

  # ==========================================
  # HTTP API Gateway (API Manager APIC)
  # ==========================================
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'stellantis-synch-status-${Env}'
      ProtocolType: HTTP
      Description: REST API per sincronizzazione eventi Kafka
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - '*'
        MaxAge: 3600

  # Stage per API Gateway
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref Env
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogGroup.Arn
        Format: '$context.requestId $context.ip $context.requestTime $context.httpMethod $context.routeKey $context.status $context.integrationStatus $context.error.message'
      ThrottleSettings:
        BurstLimit: 500
        RateLimit: 100

  # CloudWatch Log Group per API Gateway
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/stellantis-synch-status-${Env}'
      RetentionInDays: 30

  # ==========================================
  # CloudWatch Alarms
  # ==========================================
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'stellantis-synch-status-errors-${Env}'
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref SynchStatusFunction
      TreatMissingData: notBreaching

  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'stellantis-synch-status-throttles-${Env}'
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref SynchStatusFunction
      TreatMissingData: notBreaching

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'stellantis-synch-status-duration-${Env}'
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 25000 # 25 secondi
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref SynchStatusFunction
      TreatMissingData: notBreaching

Outputs:
  FunctionName:
    Description: Nome della Lambda function
    Value: !Ref SynchStatusFunction
    Export:
      Name: !Sub 'SynchStatus-Function-${Env}'

  FunctionArn:
    Description: ARN della Lambda function
    Value: !GetAtt SynchStatusFunction.Arn
    Export:
      Name: !Sub 'SynchStatus-Arn-${Env}'

  ApiEndpoint:
    Description: Endpoint API Gateway HTTP API
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}'
    Export:
      Name: !Sub 'SynchStatus-Api-${Env}'

  LogGroupName:
    Description: CloudWatch Log Group
    Value: !Sub '/aws/lambda/stellantis-synch-status-${Env}'
    Export:
      Name: !Sub 'SyncroKafkaEvents-LogGroup-${Env}'
