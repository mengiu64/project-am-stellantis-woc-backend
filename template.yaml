AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Stellantis WOC Backend — Lambda Node.js (agendaSoa, agendaSoaNaga, dms, jobcard, v360, srpV360Ota, pkEper, pkDocsoa, pkMenupricing, pkManager, translations, session, myPeople, pkFavorite) — redeploy trigger


# ── Parameters ────────────────────────────────────────────────────────────────


Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stage, prod]
    Description: Deployment environment (dev | stage | prod)

  TranslationsBucketNameOverride:
    Type: String
    Default: ''
    Description: >-
      Nome esplicito del bucket S3 Translations. Se vuoto (default), usa
      "s3-np-bsn0027990-${Environment}-translations". Da valorizzare solo
      quando il nome auto-generato collide con un bucket già esistente in
      un altro account AWS (i nomi bucket S3 sono univoci globalmente).

  VpcSubnetIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of private Subnet IDs

  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of Security Group IDs

  # ── PingFederate — DMS (dedicated client, scope prd:dmy) ──────────────────
  DmsPingClientId:
    Type: String
    NoEcho: false
  DmsPingClientSecret:
    Type: String
    NoEcho: true

  # ── AgendaSOA / AgendaSOA-Naga ────────────────────────────────────────────
  AgendaSoaHost:
    Type: String
  AgendaSoaUsername:
    Type: String
  AgendaSoaPassword:
    Type: String
    NoEcho: true
  AgendaSoaApiKey:
    Type: String
    NoEcho: true
  AgendaSoaCertSecretId:
    Type: String
    Default: apicCert
    Description: Secrets Manager secret id del certificato client mTLS (PEM) per le Lambda AgendaSOA
  AgendaSoaKeySecretId:
    Type: String
    Default: apicKey
    Description: Secrets Manager secret id della chiave privata mTLS (PEM) per le Lambda AgendaSOA

  # ── DMS (DML API) ─────────────────────────────────────────────────────────
  DmlIbmClientId:
    Type: String
  DmlIbmClientSecret:
    Type: String
    NoEcho: true
  # IBM API Connect target environment for the DML gateway (X-Target-Env header).
  # This is a DML/IBM API Connect concept ("stage"/"prod" catalog), independent
  # of the AWS SAM "Environment" parameter (dev/stage/prod stack). It must NOT be
  # tied to !Ref Environment: the "ps-dev" catalog only authorizes "stage" today,
  # so wiring it to the AWS dev stack's Environment ("dev") causes DML to reject
  # the call with "explicit deny in an identity-based policy" (403).
  DmlXTargetEnv:
    Type: String
    Default: stage

  # ── JobCard (DGT API) ─────────────────────────────────────────────────────
  DgtClientId:
    Type: String
  DgtClientSecret:
    Type: String
    NoEcho: true
  JobcardPingClientId:
    Type: String
    Description: PingFederate client id dedicated to jobcard (scope prd:dgt)
  JobcardPingClientSecret:
    Type: String
    NoEcho: true
    Description: PingFederate client secret dedicated to jobcard (scope prd:dgt)

  # ── MoparDoc: credenziali lette a runtime da SSM -> Secrets Manager (nessun parametro CFN) ──

  # ── V360 (ASV API) ────────────────────────────────────────────────────────
  AsvClientId:
    Type: String
  AsvClientSecret:
    Type: String
    NoEcho: true
  AsvGetDetailsClientId:
    Type: String
    Description: Default clientId used in getdetails request body when not provided in input (environment-specific)
  V360PingClientId:
    Type: String
    Description: PingFederate client id dedicated to v360 (scope prd:asv)
  V360PingClientSecret:
    Type: String
    NoEcho: true
    Description: PingFederate client secret dedicated to v360 (scope prd:asv)

  # ── pkEper (WsIQPckEper SOAP — FCA/Stellantis) ────────────────────────────
  EperHost:
    Type: String
  EperCoddealer:
    Type: String
  EperCodmarket:
    Type: String
  EperLingua:
    Type: String
    Default: IT

  # ── pkDocsoa (PSA/Stellantis) ─────────────────────────────────────────────
  DocsoaHost:
    Type: String
  DocsoaUsername:
    Type: String
  DocsoaPassword:
    Type: String
    NoEcho: true
  DocsoaIbmClientId:
    Type: String
    NoEcho: true
  DocsoaIbmClientSecret:
    Type: String
    NoEcho: true
  DocsoaCodbrand:
    Type: String
  DocsoaLangue:
    Type: String
  DocsoaPays:
    Type: String
  DocsoaCodepdv:
    Type: String

  # ── pkMenupricing (Opel/Vauxhall SOAP) ────────────────────────────────────
  MenupricingWsdl:
    Type: String
  MenupricingUsr:
    Type: String
  MenupricingPws:
    Type: String
    NoEcho: true
  MenupricingUsrReq:
    Type: String
  MenupricingPwsReq:
    Type: String
    NoEcho: true
  MpLanguageCode:
    Type: String
  MpCountryCode:
    Type: String
  MpDealerIdentificationCode:
    Type: String
  MpManufacturer:
    Type: String

  # ── myPeople (IURSMA readUserProfiles — PSA/Stellantis) ──────────────────
  MyPeopleHost:
    Type: String
    Default: https://api-basic-preprod.groupe-psa.com
  MyPeopleIbmClientId:
    Type: String
    NoEcho: true
  MyPeopleUsername:
    Type: String
    NoEcho: true
  MyPeoplePassword:
    Type: String
    NoEcho: true
  MyPeopleIdentifier:
    Type: String
    NoEcho: true
    Description: Fixed identifier value required by the readUserProfiles API (constant, not a per-call input)
  MyPeopleCertSecretId:
    Type: String
    Default: apicCert
    Description: Secrets Manager secret id holding the mTLS client certificate (PEM)
  MyPeopleKeySecretId:
    Type: String
    Default: apicKey
    Description: Secrets Manager secret id holding the mTLS client private key (PEM)
  MyPeopleExtensionLayerArn:
    Type: String
    Default: arn:aws:lambda:eu-west-1:015030872274:layer:AWS-Parameters-and-Secrets-Lambda-Extension:90
    Description: >-
      ARN of the AWS Parameters and Secrets Lambda Extension layer (pinned instead of a versionless
      SSM dynamic reference, because the deploy role lacks ssm:GetParameters on the public parameter).
      Bump this when AWS publishes a newer version — see
      https://docs.aws.amazon.com/systems-manager/latest/userguide/ps-integration-lambda-extensions.html#intel

  # ── pkFavorite (pacchetti/forfait preferiti del dealer per VIN — Aurora PostgreSQL) ──
  PkFavoriteDbHost:
    Type: String
    Description: >-
      Endpoint del database (consigliato: l'endpoint dell'RDS Proxy, es.
      rdsproxy-np-bsn0027990-<env>.proxy-xxxx.eu-west-1.rds.amazonaws.com, NON l'endpoint
      diretto del cluster Aurora, per beneficiare del pooling di connessioni verso le Lambda)
  PkFavoriteDbPort:
    Type: String
    Default: '5432'
  PkFavoriteDbName:
    Type: String
    Default: wiadvisor
  PkFavoriteDbSecretId:
    Type: String
    Default: sm-np-bsn0027990-dev-aurora-app
    Description: >-
      Secrets Manager secret id con le credenziali least-privilege (username/password)
      dell'utente applicativo Aurora ("wiadvisor_app"), letto tramite la AWS Parameters
      and Secrets Lambda Extension (stesso meccanismo di MyPeopleCertSecretId/MyPeopleKeySecretId)

  # ── pkDocsoa (functionServiceDb — tabella woc.listfunctions su Aurora PostgreSQL) ──
  DocsoaDbHost:
    Type: String
    Description: >-
      Endpoint del database (consigliato: l'endpoint dell'RDS Proxy, es.
      rdsproxy-np-bsn0027990-<env>.proxy-xxxx.eu-west-1.rds.amazonaws.com, NON l'endpoint
      diretto del cluster Aurora, per beneficiare del pooling di connessioni verso le Lambda)
  DocsoaDbPort:
    Type: String
    Default: '5432'
  DocsoaDbName:
    Type: String
    Default: wiadvisor
  DocsoaDbSecretId:
    Type: String
    Default: sm-np-bsn0027990-dev-aurora-app
    Description: >-
      Secrets Manager secret id con le credenziali least-privilege (username/password)
      dell'utente applicativo Aurora ("wiadvisor_app"), letto tramite la AWS Parameters
      and Secrets Lambda Extension (stesso meccanismo di PkFavoriteDbSecretId)

# ── Conditions ─────────────────────────────────────────────────────────────────

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  IsStage: !Equals [!Ref Environment, stage]
  HasTranslationsBucketNameOverride: !Not [!Equals [!Ref TranslationsBucketNameOverride, '']]

# ── Globals ───────────────────────────────────────────────────────────────────

Globals:
  Function:
    Runtime: nodejs24.x
    # 128MB (default AWS) assegna una frazione minima di vCPU: penalizza pesantemente
    # le operazioni CPU-bound (handshake TLS verso RDS Proxy, PingFederate, gateway
    # DML/DMS/job-docs — quest'ultime spesso multiple e in parallelo per singola
    # invocazione). Portato a 1024MB (vCPU quasi intera) per ridurre ulteriormente
    # le latenze percepite (es. GET pkfavorite con più preferiti, che combina
    # lettura DB + N chiamate DMS parallele).
    MemorySize: 1024
    Timeout: 30
    Tracing: Active
    Handler: index.handler
    VpcConfig:
      SubnetIds: !Ref VpcSubnetIds
      SecurityGroupIds: !Ref VpcSecurityGroupIds
    PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/StlaPermissionBoundary'

# ── Resources ─────────────────────────────────────────────────────────────────

Resources:

  AgendaSoaFunction:
    Type: AWS::Serverless::Function
    # DependsOn sulla LogGroup: la log group va creata PRIMA della Lambda, cosi'
    # la Lambda riusa quella esistente invece di crearne una in automatico
    # (evita il conflitto AlreadyExists sul replace del FunctionName).
    DependsOn: AgendaSoaFunctionLogGroup
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-agendasoa"
      CodeUri: agendaSoa/
      # Layer AWS Parameters and Secrets Lambda Extension (Req 7.2): fornisce l'endpoint
      # localhost:2773 per il recupero dei segreti mTLS.
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        # Least-privilege (Req 7.1): sola lettura dei segreti cert/key mTLS.
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AgendaSoaCertSecretId}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AgendaSoaKeySecretId}-*"
      Environment:
        Variables:
          AGENDA_SOA_HOST:     !Ref AgendaSoaHost
          AGENDA_SOA_USERNAME: !Ref AgendaSoaUsername
          AGENDA_SOA_PASSWORD: !Ref AgendaSoaPassword
          AGENDA_SOA_API_KEY:  !Ref AgendaSoaApiKey
          # Id dei segreti mTLS su Secrets Manager (Req 7.3).
          AGENDA_SOA_CERT_SECRET_ID: !Ref AgendaSoaCertSecretId
          AGENDA_SOA_KEY_SECRET_ID:  !Ref AgendaSoaKeySecretId
          # Porta HTTP della Secrets Extension (localhost:2773).
          PARAMETERS_SECRETS_EXTENSION_HTTP_PORT: "2773"

  AgendaSoaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Nome letterale (non derivato dalla Lambda) per rompere la dipendenza
      # LogGroup->Lambda: cosi' CloudFormation crea la LogGroup per prima.
      LogGroupName: !Sub "/aws/lambda/lmb-np-bsn0027990-${Environment}-agendasoa"
      RetentionInDays: 30

  AgendaSoaNagaFunction:
    Type: AWS::Serverless::Function
    # DependsOn sulla LogGroup: la log group va creata PRIMA della Lambda, cosi'
    # la Lambda riusa quella esistente invece di crearne una in automatico
    # (evita il conflitto AlreadyExists sul replace del FunctionName).
    DependsOn: AgendaSoaNagaFunctionLogGroup
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-agendasoanaga"
      CodeUri: agendaSoaNaga/
      # Layer AWS Parameters and Secrets Lambda Extension (Req 7.2): fornisce l'endpoint
      # localhost:2773 per il recupero dei segreti mTLS.
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        # Least-privilege (Req 7.1): sola lettura dei segreti cert/key mTLS.
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AgendaSoaCertSecretId}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AgendaSoaKeySecretId}-*"
      Environment:
        Variables:
          AGENDA_SOA_HOST:     !Ref AgendaSoaHost
          AGENDA_SOA_USERNAME: !Ref AgendaSoaUsername
          AGENDA_SOA_PASSWORD: !Ref AgendaSoaPassword
          AGENDA_SOA_API_KEY:  !Ref AgendaSoaApiKey
          # Id dei segreti mTLS su Secrets Manager (Req 7.3).
          AGENDA_SOA_CERT_SECRET_ID: !Ref AgendaSoaCertSecretId
          AGENDA_SOA_KEY_SECRET_ID:  !Ref AgendaSoaKeySecretId
          # Porta HTTP della Secrets Extension (localhost:2773).
          PARAMETERS_SECRETS_EXTENSION_HTTP_PORT: "2773"

  AgendaSoaNagaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Nome letterale (non derivato dalla Lambda) per rompere la dipendenza
      # LogGroup->Lambda: cosi' CloudFormation crea la LogGroup per prima.
      LogGroupName: !Sub "/aws/lambda/lmb-np-bsn0027990-${Environment}-agendasoanaga"
      RetentionInDays: 30

  # CodeUri: ./ + BuildMethod: makefile perché dmsService.js::buildApplicationArea
  # richiede in-process dbManager/db + dbManager/AnagSnowflakesRepository (stesso
  # pattern di PkManagerFunction/SessionFunction/PkFavoriteFunction/JobCardFunction,
  # vedi Makefile) per risolvere physicalSiteId/dealerNumberIdSource da
  # woc.ang_snowflakes — logica centralizzata qui e condivisa da tutti i chiamanti
  # di postDmsInquiry (jobcard, pkManager, pkFavorite).
  DmsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-dms"
      CodeUri: ./
      Handler: dms/index.handler
      # dbManager (imbarcato in-process via Makefile) richiede l'estensione Lambda
      # + il permesso Secrets Manager per leggere lo stesso secret Aurora
      # "wiadvisor_app" già usato da PkManagerFunction/PkFavoriteFunction/SessionFunction/
      # JobCardFunction per il proprio dbManager — nessun nuovo parametro CFN necessario.
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DocsoaDbSecretId}-*"
            # Il secret è cifrato con una chiave KMS gestita dal cliente (non la
            # default aws/secretsmanager): senza kms:Decrypt la Lambda Parameters
            # and Secrets Extension fallisce con "HTTP 400 - an unexpected error
            # occurred while executing request" (stesso problema già risolto per
            # PkFavoriteFunction/SessionFunction/PkManagerFunction/JobCardFunction).
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
      Environment:
        Variables:
          DMS_PING_CLIENT_ID:     !Ref DmsPingClientId
          DMS_PING_CLIENT_SECRET: !Ref DmsPingClientSecret
          DML_IBM_CLIENT_ID:    !Ref DmlIbmClientId
          DML_IBM_CLIENT_SECRET: !Ref DmlIbmClientSecret
          DML_X_TARGET_ENV:     !Ref DmlXTargetEnv
          # dbManager/db.js (in-process, vedi Makefile) — dmsService.js::buildApplicationArea
          # risolve physicalSiteId/dealerNumberIdSource (tabella woc.ang_snowflakes) per
          # il Sender dinamico. Riusa lo stesso Aurora/secret di PkManagerFunction
          # (nessun nuovo parametro CFN necessario).
          DBMANAGER_DB_HOST:      !Ref DocsoaDbHost
          DBMANAGER_DB_PORT:      !Ref DocsoaDbPort
          DBMANAGER_DB_NAME:      !Ref DocsoaDbName
          DBMANAGER_DB_SECRET_ID: !Ref DocsoaDbSecretId

  DmsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DmsFunction}"
      RetentionInDays: 30

  # CodeUri: ./ + BuildMethod: makefile perché jobCardService.js::getCartPriceAndAvailability
  # richiede in-process dms/authService + dms/dmsService (stesso pattern di
  # PkManagerFunction/SessionFunction/PkFavoriteFunction, vedi Makefile) per la
  # chiamata al gateway DML (prezzo/disponibilità ricambi e manodopera).
  JobCardFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-jobcard"
      CodeUri: ./
      Handler: jobcard/index.handler
      # dbManager (imbarcato in-process via Makefile, richiesto da dms/dmsService.js
      # ::buildApplicationArea) richiede l'estensione Lambda + il permesso Secrets
      # Manager per leggere lo stesso secret Aurora "wiadvisor_app" già usato da
      # PkManagerFunction/PkFavoriteFunction/SessionFunction/DmsFunction per il
      # proprio dbManager — nessun nuovo parametro CFN necessario (il lookup
      # physicalSiteId/dealerNumberIdSource su woc.ang_snowflakes è centralizzato
      # in dms/dmsService.js, non in jobCardService.js::buildDmsSender).
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DocsoaDbSecretId}-*"
            # Il secret è cifrato con una chiave KMS gestita dal cliente (non la
            # default aws/secretsmanager): senza kms:Decrypt la Lambda Parameters
            # and Secrets Extension fallisce con "HTTP 400 - an unexpected error
            # occurred while executing request" (stesso problema già risolto per
            # PkFavoriteFunction/SessionFunction/PkManagerFunction).
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
      Environment:
        Variables:
          JOBCARD_PING_CLIENT_ID:     !Ref JobcardPingClientId
          JOBCARD_PING_CLIENT_SECRET: !Ref JobcardPingClientSecret
          DGT_CLIENT_ID:      !Ref DgtClientId
          DGT_CLIENT_SECRET:  !Ref DgtClientSecret
          # dms/config.js (in-process, vedi Makefile) — gateway DML usato da
          # getCartPriceAndAvailability, stessi valori usati da PkManagerFunction/PkFavoriteFunction.
          DMS_PING_CLIENT_ID:     !Ref DmsPingClientId
          DMS_PING_CLIENT_SECRET: !Ref DmsPingClientSecret
          DML_IBM_CLIENT_ID:      !Ref DmlIbmClientId
          DML_IBM_CLIENT_SECRET:  !Ref DmlIbmClientSecret
          DML_X_TARGET_ENV:       !Ref DmlXTargetEnv
          # dbManager/db.js (in-process, vedi Makefile) — richiesto da dms/dmsService.js
          # ::buildApplicationArea (imbarcato in-process insieme a jobcard), che risolve
          # physicalSiteId/dealerNumberIdSource (tabella woc.ang_snowflakes) per il Sender
          # dinamico dell'inquiry DMS. Riusa lo stesso Aurora/secret di PkManagerFunction/
          # DmsFunction (nessun nuovo parametro CFN necessario).
          DBMANAGER_DB_HOST:      !Ref DocsoaDbHost
          DBMANAGER_DB_PORT:      !Ref DocsoaDbPort
          DBMANAGER_DB_NAME:      !Ref DocsoaDbName
          DBMANAGER_DB_SECRET_ID: !Ref DocsoaDbSecretId

  JobCardFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${JobCardFunction}"
      RetentionInDays: 30

  # DjcFunction: declinazione di JobCardFunction (Digital Job Card). Espone
  # l'azione "saveJobcard" (POST /jobCard) e riusa lo stesso client
  # PingFederate/DGT di jobcard, quindi condivide gli stessi parametri
  # JobcardPingClientId/Secret e DgtClientId/Secret.
  DjcFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-djc"
      CodeUri: djc/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Environment:
        Variables:
          JOBCARD_PING_CLIENT_ID:     !Ref JobcardPingClientId
          JOBCARD_PING_CLIENT_SECRET: !Ref JobcardPingClientSecret
          DGT_CLIENT_ID:      !Ref DgtClientId
          DGT_CLIENT_SECRET:  !Ref DgtClientSecret

  DjcFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DjcFunction}"
      RetentionInDays: 30

  # MoparDocFunction: gestisce createJobCard/createAccessToken (job-docs
  # connector PSA), getUploadDocURL e uploadedDoc (MoparDocs Browser API
  # FCA/Fiat). Usa un client PingFederate dedicato (scope prd:mdo,
  # credenziali diverse da jobcard/djc) e credenziali IBM API Connect proprie.
  MoparDocFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-mopardoc"
      CodeUri: moparDoc/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub
                  - "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPath}"
                  - ParamPath: !If [IsProd, "/app/BSN0027990/mopardoc_ibm", !Sub "/app/np-BSN0027990-${Environment}/mopardoc_ibm"]
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !If
                  - IsProd
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sm-bsn0027990-mopardoc_ibm-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sm-np-bsn0027990-${Environment}-mopardoc_ibm-*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
      Environment:
        Variables:
          MOPARDOC_PARAM_NAME: !If
            - IsProd
            - /app/BSN0027990/mopardoc_ibm
            - !Sub /app/np-BSN0027990-${Environment}/mopardoc_ibm

  MoparDocFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MoparDocFunction}"
      RetentionInDays: 30

  V360Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-v360"
      CodeUri: v360/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - S3ReadPolicy:
            BucketName: !Ref TranslationsBucket
      Environment:
        Variables:
          V360_PING_CLIENT_ID:     !Ref V360PingClientId
          V360_PING_CLIENT_SECRET: !Ref V360PingClientSecret
          ASV_CLIENT_ID:      !Ref AsvClientId
          ASV_CLIENT_SECRET:  !Ref AsvClientSecret
          ASV_GETDETAILS_CLIENT_ID: !Ref AsvGetDetailsClientId
          CONFIG_BUCKET_NAME: !Ref TranslationsBucket

  V360FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${V360Function}"
      RetentionInDays: 30

  # ── srpV360Ota (OTA Compatibility BFF — credenziali da SSM/Secrets Manager) ──
  #
  # Lambda indipendente dal modulo v360 a livello di codice sorgente.
  # Le credenziali PingFederate e IBM API Connect sono recuperate a runtime
  # da Secrets Manager (ARN letto da un parametro SSM), stesso pattern di
  # isStellantisBrand per il database.
  SrpV360OtaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-srpv360ota"
      CodeUri: srpV360Ota/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub
                  - "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPath}"
                  - ParamPath: !If [IsProd, "/app/BSN0027990/SRP_V360_OTA", !Sub "/app/np-BSN0027990-${Environment}/SRP_V360_OTA"]
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: "*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
      Environment:
        Variables:
          SRP_V360_OTA_SECRET_ARN_PARAM: !If
            - IsProd
            - /app/BSN0027990/SRP_V360_OTA
            - !Sub /app/np-BSN0027990-${Environment}/SRP_V360_OTA

  SrpV360OtaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SrpV360OtaFunction}"
      RetentionInDays: 30

  PkEperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-pkeper"
      CodeUri: pkEper/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Environment:
        Variables:
          EPER_HOST: !Ref EperHost

  PkEperFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PkEperFunction}"
      RetentionInDays: 30

  # Il certificato/chiave mTLS ("apicCert"/"apicKey", gli STESSI usati da myPeople)
  # sono letti da AWS Secrets Manager tramite la AWS Parameters and Secrets Lambda
  # Extension (layer), esattamente come in MyPeopleFunction. La funzione gira in
  # VPC (Globals.Function.VpcConfig): è necessario un endpoint di rete verso
  # Secrets Manager (VPC Interface Endpoint o NAT Gateway).
  PkDocsoaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-pkdocsoa"
      CodeUri: pkDocsoa/
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleCertSecretId}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleKeySecretId}-*"
      Environment:
        Variables:
          DOCSOA_HOST:              !Ref DocsoaHost
          DOCSOA_USERNAME:          !Ref DocsoaUsername
          DOCSOA_PASSWORD:          !Ref DocsoaPassword
          DOCSOA_IBM_CLIENT_ID:     !Ref DocsoaIbmClientId
          DOCSOA_IBM_CLIENT_SECRET: !Ref DocsoaIbmClientSecret
          DOCSOA_CERT_SECRET_ID:    !Ref MyPeopleCertSecretId
          DOCSOA_KEY_SECRET_ID:     !Ref MyPeopleKeySecretId

  PkDocsoaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PkDocsoaFunction}"
      RetentionInDays: 30

  PkMenupricingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-pkmenupricing"
      CodeUri: pkMenupricing/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Environment:
        Variables:
          MENUPRICING_WSDL:    !Ref MenupricingWsdl
          MENUPRICING_USR:     !Ref MenupricingUsr
          MENUPRICING_PWS:     !Ref MenupricingPws
          MENUPRICING_USR_REQ: !Ref MenupricingUsrReq
          MENUPRICING_PWS_REQ: !Ref MenupricingPwsReq

  PkMenupricingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PkMenupricingFunction}"
      RetentionInDays: 30

  # ── Translations (bucket S3 + Lambda) ──────────────────────────────────────

  TranslationsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - HasTranslationsBucketNameOverride
        - !Ref TranslationsBucketNameOverride
        - !Sub "s3-np-bsn0027990-${Environment}-translations"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  TranslationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-translations"
      CodeUri: translations/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - S3ReadPolicy:
            BucketName: !Ref TranslationsBucket
      Environment:
        Variables:
          TRANSLATIONS_BUCKET_NAME: !Ref TranslationsBucket

  TranslationsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${TranslationsFunction}"
      RetentionInDays: 30

  PkManagerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-pkmanager"
      CodeUri: ./
      Handler: pkManager/index.handler
      # pkDocsoa (imbarcato in-process via Makefile) richiede l'estensione Lambda +
      # il permesso Secrets Manager per il proprio mTLS (certificato/chiave "apicCert"/"apicKey",
      # gli STESSI usati da myPeople) — vedi PkDocsoaFunction/MyPeopleFunction.
      # dbManager (anch'esso imbarcato in-process via Makefile) richiede lo stesso
      # secret Aurora "wiadvisor_app" di pkDocsoa (DocsoaDbSecretId): nessun nuovo
      # parametro/permesso da aggiungere.
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleCertSecretId}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleKeySecretId}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DocsoaDbSecretId}-*"
            # pkDocsoa/functionServiceDb e dbManager/db.js leggono da Aurora tramite
            # Secrets Manager: il secret è cifrato con una chiave KMS gestita dal
            # cliente (non la default aws/secretsmanager), stesso caso già risolto
            # per PkFavoriteFunction.
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
      Environment:
        Variables:
          EPER_HOST:                    !Ref EperHost
          EPER_CODDEALER:               !Ref EperCoddealer
          EPER_CODMARKET:                !Ref EperCodmarket
          EPER_LINGUA:                  !Ref EperLingua
          DOCSOA_HOST:                  !Ref DocsoaHost
          DOCSOA_USERNAME:              !Ref DocsoaUsername
          DOCSOA_PASSWORD:              !Ref DocsoaPassword
          DOCSOA_IBM_CLIENT_ID:         !Ref DocsoaIbmClientId
          DOCSOA_IBM_CLIENT_SECRET:     !Ref DocsoaIbmClientSecret
          DOCSOA_CERT_SECRET_ID:        !Ref MyPeopleCertSecretId
          DOCSOA_KEY_SECRET_ID:         !Ref MyPeopleKeySecretId
          DOCSOA_CODBRAND:              !Ref DocsoaCodbrand
          DOCSOA_LANGUE:                !Ref DocsoaLangue
          # functionServiceDb (pkDocsoa/db.js + config.js) — lettura di woc.listfunctions
          # da Aurora PostgreSQL "wiadvisor" tramite RDS Proxy, stesso pattern di PkFavoriteFunction.
          DOCSOA_DB_HOST:               !Ref DocsoaDbHost
          DOCSOA_DB_PORT:               !Ref DocsoaDbPort
          DOCSOA_DB_NAME:               !Ref DocsoaDbName
          DOCSOA_DB_SECRET_ID:          !Ref DocsoaDbSecretId
          DOCSOA_PAYS:                  !Ref DocsoaPays
          DOCSOA_CODEPDV:               !Ref DocsoaCodepdv
          # dbManager/db.js + config.js (in-process, vedi Makefile) — getPkList risolve
          # pkwstouse leggendo HQ_PKCONFIG dallo STESSO cluster Aurora "wiadvisor"
          # (stesso RDS Proxy/secret di DOCSOA_DB_*, nessun nuovo parametro necessario).
          DBMANAGER_DB_HOST:            !Ref DocsoaDbHost
          DBMANAGER_DB_PORT:            !Ref DocsoaDbPort
          DBMANAGER_DB_NAME:            !Ref DocsoaDbName
          DBMANAGER_DB_SECRET_ID:       !Ref DocsoaDbSecretId
          MENUPRICING_WSDL:             !Ref MenupricingWsdl
          MENUPRICING_USR:              !Ref MenupricingUsr
          MENUPRICING_PWS:              !Ref MenupricingPws
          MENUPRICING_USR_REQ:          !Ref MenupricingUsrReq
          MENUPRICING_PWS_REQ:          !Ref MenupricingPwsReq
          MP_LANGUAGE_CODE:             !Ref MpLanguageCode
          MP_COUNTRY_CODE:              !Ref MpCountryCode
          MP_DEALER_IDENTIFICATION_CODE: !Ref MpDealerIdentificationCode
          MP_MANUFACTURER:              !Ref MpManufacturer
          DMS_PING_CLIENT_ID:           !Ref DmsPingClientId
          DMS_PING_CLIENT_SECRET:       !Ref DmsPingClientSecret
          DML_IBM_CLIENT_ID:            !Ref DmlIbmClientId
          DML_IBM_CLIENT_SECRET:        !Ref DmlIbmClientSecret
          DML_X_TARGET_ENV:             !Ref DmlXTargetEnv

  PkManagerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PkManagerFunction}"
      RetentionInDays: 30

  # SessionFunction impacchetta l'intero repo (CodeUri: ./, BuildMethod: makefile) perché,
  # oltre al proprio codice, richiede in-process myPeople/myPeopleService e dms/authService +
  # dms/dmsService (stesso pattern già usato da PkManagerFunction per dms/pkEper/..., vedi
  # Makefile) per il flusso "evolutivo" username -> myPeople -> dms/settings, oltre a
  # dbManager/db.js + dbManager/AnagSnowflakesRepository.js per risolvere `marketIso`
  # (tabella woc.ang_snowflakes).
  SessionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-session"
      CodeUri: ./
      Handler: session/src/index.handler
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - S3ReadPolicy:
            BucketName: !Ref TranslationsBucket
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleCertSecretId}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleKeySecretId}-*"
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${PkFavoriteDbSecretId}-*"
            # Il secret è cifrato con una chiave KMS gestita dal cliente (non la
            # default aws/secretsmanager): senza kms:Decrypt la Lambda Parameters
            # and Secrets Extension fallisce con "HTTP 400 - an unexpected error
            # occurred while executing request" (stesso problema già risolto per
            # PkFavoriteFunction/isStellantisBrand).
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
      Environment:
        Variables:
          SESSION_BUCKET_NAME: !Ref TranslationsBucket
          SESSION_DATA_KEY: session/session_data.json
          # myPeople (usato dal flusso username -> myPeople -> dms/settings)
          MYPEOPLE_HOST:            !Ref MyPeopleHost
          MYPEOPLE_IBM_CLIENT_ID:   !Ref MyPeopleIbmClientId
          MYPEOPLE_USERNAME:        !Ref MyPeopleUsername
          MYPEOPLE_PASSWORD:        !Ref MyPeoplePassword
          MYPEOPLE_IDENTIFIER:      !Ref MyPeopleIdentifier
          MYPEOPLE_CERT_SECRET_ID:  !Ref MyPeopleCertSecretId
          MYPEOPLE_KEY_SECRET_ID:   !Ref MyPeopleKeySecretId
          # dms (usato dallo stesso flusso, per dms/settings)
          DMS_PING_CLIENT_ID:       !Ref DmsPingClientId
          DMS_PING_CLIENT_SECRET:   !Ref DmsPingClientSecret
          DML_IBM_CLIENT_ID:        !Ref DmlIbmClientId
          DML_IBM_CLIENT_SECRET:    !Ref DmlIbmClientSecret
          DML_X_TARGET_ENV:         !Ref DmlXTargetEnv
          # dmlConfigSync/db.js (in-process, vedi Makefile) — lettura della cache
          # company-types/customer-titles (woc.dml_configurations), popolata dal job
          # giornaliero DmlConfigSyncFunction. Riusa lo stesso Aurora/secret di
          # pkFavorite/dbManager (nessun nuovo parametro CFN necessario).
          DMLCONFIGSYNC_DB_HOST:      !Ref PkFavoriteDbHost
          DMLCONFIGSYNC_DB_PORT:      !Ref PkFavoriteDbPort
          DMLCONFIGSYNC_DB_NAME:      !Ref PkFavoriteDbName
          DMLCONFIGSYNC_DB_SECRET_ID: !Ref PkFavoriteDbSecretId
          # dbManager/db.js (in-process, vedi Makefile) — risoluzione di `marketIso`
          # (tabella woc.ang_snowflakes) tramite dbManager/AnagSnowflakesRepository.
          # Riusa lo stesso Aurora/secret di pkFavorite/dmlConfigSync (nessun nuovo
          # parametro CFN necessario).
          DBMANAGER_DB_HOST:      !Ref PkFavoriteDbHost
          DBMANAGER_DB_PORT:      !Ref PkFavoriteDbPort
          DBMANAGER_DB_NAME:      !Ref PkFavoriteDbName
          DBMANAGER_DB_SECRET_ID: !Ref PkFavoriteDbSecretId

  SessionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SessionFunction}"
      RetentionInDays: 30

  # ── myPeople (IURSMA readUserProfiles) ────────────────────────────────────
  #
  # Il certificato/chiave mTLS ("apicCert"/"apicKey") sono letti da AWS Secrets
  # Manager tramite la AWS Parameters and Secrets Lambda Extension (layer),
  # per non dover imbarcare l'SDK e per beneficiare della cache locale
  # dell'estensione. La funzione gira in VPC (Globals.Function.VpcConfig):
  # è necessario un endpoint di rete verso Secrets Manager (VPC Interface
  # Endpoint o NAT Gateway) affinché l'estensione riesca a recuperare i segreti.
  MyPeopleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-mypeople"
      CodeUri: myPeople/
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleCertSecretId}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleKeySecretId}-*"
      Environment:
        Variables:
          MYPEOPLE_HOST:            !Ref MyPeopleHost
          MYPEOPLE_IBM_CLIENT_ID:   !Ref MyPeopleIbmClientId
          MYPEOPLE_USERNAME:        !Ref MyPeopleUsername
          MYPEOPLE_PASSWORD:        !Ref MyPeoplePassword
          MYPEOPLE_IDENTIFIER:      !Ref MyPeopleIdentifier
          MYPEOPLE_CERT_SECRET_ID:  !Ref MyPeopleCertSecretId
          MYPEOPLE_KEY_SECRET_ID:   !Ref MyPeopleKeySecretId

  MyPeopleFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MyPeopleFunction}"
      RetentionInDays: 30

  # ── pkFavorite (pacchetti/forfait preferiti del dealer per VIN) ───────────
  #
  # GET  -> elenca i preferiti di un dealer (username, da authorizer.sub) per un VIN,
  #         arricchiti con i dati DML (Code/PackageDescription/PartsAvailablity/
  #         TotalPriceInclTax/TotalPriceExclTax) via dms/dmsService::postDmsInquiry
  #         (MessageType LFP, una chiamata per ciascun codice pacchetto preferito)
  # POST -> crea il preferito se non esiste, altrimenti lo elimina ("toggle")
  # Tabella PKFAVORITE su Aurora PostgreSQL "wiadvisor" (vedi sql/create_tables.sql).
  # Le credenziali dell'utente applicativo Aurora least-privilege ("wiadvisor_app")
  # sono lette da Secrets Manager tramite la AWS Parameters and Secrets Lambda
  # Extension (layer), stesso meccanismo già usato da myPeople/pkDocsoa/session.
  # La funzione gira in VPC (Globals.Function.VpcConfig): il Security Group Lambda
  # deve avere accesso in ingresso consentito sul Security Group dell'RDS Proxy
  # (porta 5432), come già configurato per le altre Lambda del progetto.
  # CodeUri: ./ + BuildMethod: makefile perché index.js richiede in-process
  # dms/authService + dms/dmsService (stesso pattern di PkManagerFunction/
  # SessionFunction, vedi Makefile) per la chiamata al gateway DML.
  PkFavoriteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-pkfavorite"
      CodeUri: ./
      Handler: pkFavorite/index.handler
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${PkFavoriteDbSecretId}-*"
            # Il secret è cifrato con una chiave KMS gestita dal cliente (non la
            # default aws/secretsmanager): senza kms:Decrypt la Lambda Parameters
            # and Secrets Extension fallisce con "HTTP 400 - an unexpected error
            # occurred while executing request" (stesso problema già risolto per
            # isStellantisBrand).
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
      Environment:
        Variables:
          PKFAVORITE_DB_HOST:      !Ref PkFavoriteDbHost
          PKFAVORITE_DB_PORT:      !Ref PkFavoriteDbPort
          PKFAVORITE_DB_NAME:      !Ref PkFavoriteDbName
          PKFAVORITE_DB_SECRET_ID: !Ref PkFavoriteDbSecretId
          # dms/config.js (in-process, vedi Makefile) — gateway DML per l'arricchimento
          # dei preferiti (MessageType LFP), stessi valori usati da PkManagerFunction.
          DMS_PING_CLIENT_ID:    !Ref DmsPingClientId
          DMS_PING_CLIENT_SECRET: !Ref DmsPingClientSecret
          DML_IBM_CLIENT_ID:     !Ref DmlIbmClientId
          DML_IBM_CLIENT_SECRET: !Ref DmlIbmClientSecret
          DML_X_TARGET_ENV:      !Ref DmlXTargetEnv
          # dbManager/db.js (in-process, vedi Makefile) — richiesto da
          # dms/dmsService.js::buildApplicationArea (bundlato insieme a pkFavorite)
          # per risolvere physicalSiteId/dealerNumberIdSource (tabella
          # woc.ang_snowflakes) del Sender dinamico dell'inquiry DMS. Riusa lo
          # stesso Aurora/secret di pkFavorite (nessun nuovo parametro CFN necessario).
          DBMANAGER_DB_HOST:      !Ref PkFavoriteDbHost
          DBMANAGER_DB_PORT:      !Ref PkFavoriteDbPort
          DBMANAGER_DB_NAME:      !Ref PkFavoriteDbName
          DBMANAGER_DB_SECRET_ID: !Ref PkFavoriteDbSecretId

  PkFavoriteFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PkFavoriteFunction}"
      RetentionInDays: 30

  # ── dbManager (getPkwstouse — configurazione pacchetti per mercato/brand) ─
  #
  # Risolve, per una coppia (codmarket, codbrand), quale web service pacchetti
  # (eper/docsoa/menupricing) usare, leggendo la tabella HQ_PKCONFIG sullo STESSO
  # cluster Aurora PostgreSQL "wiadvisor" già usato da pkDocsoa/pkFavorite (match
  # esatto CODMARKET+CODBRAND, altrimenti fallback su CODMARKET IS NULL). Riusa i
  # parametri Docsoa* (stesso RDS Proxy/secret) invece di dichiararne di nuovi, per
  # non richiedere modifiche alla pipeline di deploy esterna (parameter-overrides).
  # Nessuna dipendenza cross-folder: CodeUri punta direttamente alla cartella del
  # modulo (niente BuildMethod: makefile).
  DbManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-dbmanager"
      CodeUri: dbManager/
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DocsoaDbSecretId}-*"
            # Il secret è cifrato con una chiave KMS gestita dal cliente (non la
            # default aws/secretsmanager): senza kms:Decrypt la Lambda Parameters
            # and Secrets Extension fallisce con "HTTP 400 - an unexpected error
            # occurred while executing request" (stesso problema già risolto per
            # PkFavoriteFunction/isStellantisBrand).
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
      Environment:
        Variables:
          DBMANAGER_DB_HOST:      !Ref DocsoaDbHost
          DBMANAGER_DB_PORT:      !Ref DocsoaDbPort
          DBMANAGER_DB_NAME:      !Ref DocsoaDbName
          DBMANAGER_DB_SECRET_ID: !Ref DocsoaDbSecretId

  DbManagerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DbManagerFunction}"
      RetentionInDays: 30

  # ── dmlConfigSync (sync giornaliera company-types/customer-titles DML) ───
  #
  # Triggerata 1 volta al giorno da EventBridge Schedule (Events.DailySync sotto):
  # per ciascun mercato abilitato (tabella woc.dml_enabled_markets) chiama
  # dms/getCompanyTypes + dms/getCustomerTitles (stesso bearer token/credenziali IBM
  # di dms/settings/PkManagerFunction/PkFavoriteFunction/JobCardFunction) e upserta il
  # risultato nella tabella woc.dml_configurations sullo STESSO cluster Aurora
  # PostgreSQL "wiadvisor" già usato da pkFavorite/dbManager (riusa i parametri
  # PkFavorite* invece di dichiararne di nuovi, per non richiedere modifiche alla
  # pipeline di deploy esterna). SessionFunction legge questa tabella al posto di
  # chiamare live i due servizi DML (vedi session/src/repositories/
  # myPeopleDmsSessionRepository.js). CodeUri: ./ + BuildMethod: makefile perché
  # index.js richiede in-process dms/authService + dms/dmsService (stesso pattern di
  # PkManagerFunction/SessionFunction/PkFavoriteFunction/JobCardFunction, vedi Makefile).
  # Timeout più alto del default (30s): il job itera N mercati abilitati, ciascuno con
  # 2 chiamate HTTP sequenziali al gateway DML più l'upsert su Aurora.
  DmlConfigSyncFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-dmlconfigsync"
      CodeUri: ./
      Handler: dmlConfigSync/index.handler
      Timeout: 120
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${PkFavoriteDbSecretId}-*"
            # Il secret è cifrato con una chiave KMS gestita dal cliente (non la
            # default aws/secretsmanager): senza kms:Decrypt la Lambda Parameters
            # and Secrets Extension fallisce con "HTTP 400 - an unexpected error
            # occurred while executing request" (stesso problema già risolto per
            # PkFavoriteFunction/isStellantisBrand/DbManagerFunction).
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
      Environment:
        Variables:
          DMLCONFIGSYNC_DB_HOST:      !Ref PkFavoriteDbHost
          DMLCONFIGSYNC_DB_PORT:      !Ref PkFavoriteDbPort
          DMLCONFIGSYNC_DB_NAME:      !Ref PkFavoriteDbName
          DMLCONFIGSYNC_DB_SECRET_ID: !Ref PkFavoriteDbSecretId
          # dms/config.js (in-process, vedi Makefile) — gateway DML per company-types/
          # customer-titles, stessi valori usati da PkManagerFunction/PkFavoriteFunction/SessionFunction.
          DMS_PING_CLIENT_ID:     !Ref DmsPingClientId
          DMS_PING_CLIENT_SECRET: !Ref DmsPingClientSecret
          DML_IBM_CLIENT_ID:      !Ref DmlIbmClientId
          DML_IBM_CLIENT_SECRET:  !Ref DmlIbmClientSecret
          DML_X_TARGET_ENV:       !Ref DmlXTargetEnv
      Events:
        DailySync:
          Type: Schedule
          Properties:
            # 08:00 UTC ogni giorno (era 03:00 UTC: spostato più tardi perché il
            # gateway DML Stellantis sembra non essere disponibile/stabile di notte —
            # osservato un HTTP 502 "Internal server error" sulla sync delle 03:00 UTC
            # del 2026-09-02, risolto poche ore dopo. 08:00 UTC = 10:00 CEST / 09:00 CET,
            # quindi resta comunque fuori dagli orari di punta EMEA per tutto l'anno
            # (nota: EventBridge Schedule interpreta sempre l'orario in UTC, non in ora
            # locale). Regolabile senza toccare il codice.
            Schedule: cron(0 8 * * ? *)
            Name: !Sub "sch-np-bsn0027990-${Environment}-dmlconfigsync-daily"
            Description: Sync giornaliera company-types/customer-titles DML per i mercati abilitati
            Enabled: true

  DmlConfigSyncFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DmlConfigSyncFunction}"
      RetentionInDays: 30

  # ── auroraAutoStart (riavvio automatico mattutino del cluster Aurora di stage) ──
  #
  # Un tool centralizzato Stellantis ("Stellantis startstop tool", esterno a questo
  # repository) spegne ogni sera il cluster Aurora "rds-np-bsn0027990-${Environment}-aurora"
  # per risparmio costi (tag "stla_scheduler_action" applicato al cluster), ma NON
  # prevede un riavvio automatico al mattino: verificato via CloudTrail (tutti gli
  # StartDBCluster storici erano invocazioni manuali di un operatore). Questa Lambda,
  # triggerata da EventBridge Schedule (Events.WeekdayMorningStart sotto), chiama
  # rds:StartDBCluster SOLO se lo stato corrente del cluster è "stopped" (idempotente:
  # nessun errore se già avviato manualmente prima dello scheduling).
  # Deployata SOLO per l'ambiente stage (Condition: IsStage): l'ambiente dev resta
  # sempre acceso (nessuno spegnimento automatico osservato), prod non è gestito da
  # questo scheduler. Nessun nuovo parametro CloudFormation: il nome del cluster segue
  # la stessa convenzione di naming già in uso ("rds-np-bsn0027990-${Environment}-aurora").
  AuroraAutoStartFunction:
    Type: AWS::Serverless::Function
    Condition: IsStage
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-auroraautostart"
      CodeUri: auroraAutoStart/
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - rds:DescribeDBClusters
                - rds:StartDBCluster
              Resource: !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:rds-np-bsn0027990-${Environment}-aurora"
      Environment:
        Variables:
          AURORAAUTOSTART_DB_CLUSTER_IDENTIFIER: !Sub "rds-np-bsn0027990-${Environment}-aurora"
      Events:
        WeekdayMorningStart:
          Type: Schedule
          Properties:
            # 06:00 UTC nei giorni lavorativi (lun-ven) = 08:00 CEST / 07:00 CET:
            # con margine rispetto all'orario di lavoro EMEA (~08:00-09:00 locale),
            # considerando anche i pochi minuti necessari ad Aurora per passare da
            # "stopped" ad "available". Nessuna esecuzione nel weekend (il cluster
            # viene comunque rispento la sera dal tool Stellantis se avviato per
            # errore). Nota: EventBridge Schedule interpreta sempre l'orario in UTC,
            # non in ora locale — regolabile senza toccare il codice.
            Schedule: cron(0 6 ? * MON-FRI *)
            Name: !Sub "sch-np-bsn0027990-${Environment}-auroraautostart-weekday-morning"
            Description: Avvio automatico mattutino (lun-ven) del cluster Aurora di stage se spento
            Enabled: true

  AuroraAutoStartFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsStage
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AuroraAutoStartFunction}"
      RetentionInDays: 30

  # ── isStellantisBrand (Aurora via RDS Proxy) ──────────────────────────────

  IsStellantisBrandFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-isstellantisbrand"
      CodeUri: isStellantisBrand/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub
                  - "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPath}"
                  - ParamPath: !If [IsProd, "/app/BSN0027990/DB_SECRET_ARN", !Sub "/app/np-BSN0027990-${Environment}/DB_SECRET_ARN"]
                - !Sub
                  - "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPath}"
                  - ParamPath: !If [IsProd, "/app/BSN0027990/RDS_PROXY_ENDPOINT", !Sub "/app/np-BSN0027990-${Environment}/RDS_PROXY_ENDPOINT"]
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: "*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
      Environment:
        Variables:
          DB_SECRET_ARN_PARAM: !If
            - IsProd
            - /app/BSN0027990/DB_SECRET_ARN
            - !Sub /app/np-BSN0027990-${Environment}/DB_SECRET_ARN
          RDS_PROXY_ENDPOINT_PARAM: !If
            - IsProd
            - /app/BSN0027990/RDS_PROXY_ENDPOINT
            - !Sub /app/np-BSN0027990-${Environment}/RDS_PROXY_ENDPOINT

  IsStellantisBrandFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${IsStellantisBrandFunction}"
      RetentionInDays: 30

