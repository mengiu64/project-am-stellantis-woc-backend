AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Stellantis WOC Backend — Lambda Node.js (agendaSoa, agendaSoaNaga, dms, jobcard, v360, srpV360Ota, pkEper, pkDocsoa, pkMenupricing, pkManager, translations, session, myPeople, pkFavorite)


# ── Parameters ────────────────────────────────────────────────────────────────


Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stage, prod]
    Description: Deployment environment (dev | stage | prod)

  VpcSubnetIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of private Subnet IDs

  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of Security Group IDs

  # ── PingFederate — DMS (dedicated client, scope prd:dmy) ──────────────────
  DmsPingClientId:
    Type: String
    NoEcho: false
  DmsPingClientSecret:
    Type: String
    NoEcho: true

  # ── AgendaSOA / AgendaSOA-Naga ────────────────────────────────────────────
  AgendaSoaHost:
    Type: String
  AgendaSoaUsername:
    Type: String
  AgendaSoaPassword:
    Type: String
    NoEcho: true
  AgendaSoaApiKey:
    Type: String
    NoEcho: true
  AgendaSoaCertKey:
    Type: String
    Default: certs/mwpaga0a.cer
    Description: S3 object key of the AgendaSOA mTLS client certificate (.cer), inside TranslationsBucket
  AgendaSoaKeyKey:
    Type: String
    Default: certs/mwpaga0a.key
    Description: S3 object key of the AgendaSOA mTLS client private key (.key), inside TranslationsBucket

  # ── DMS (DML API) ─────────────────────────────────────────────────────────
  DmlIbmClientId:
    Type: String
  DmlIbmClientSecret:
    Type: String
    NoEcho: true
  # IBM API Connect target environment for the DML gateway (X-Target-Env header).
  # This is a DML/IBM API Connect concept ("stage"/"prod" catalog), independent
  # of the AWS SAM "Environment" parameter (dev/stage/prod stack). It must NOT be
  # tied to !Ref Environment: the "ps-dev" catalog only authorizes "stage" today,
  # so wiring it to the AWS dev stack's Environment ("dev") causes DML to reject
  # the call with "explicit deny in an identity-based policy" (403).
  DmlXTargetEnv:
    Type: String
    Default: stage

  # ── JobCard (DGT API) ─────────────────────────────────────────────────────
  DgtClientId:
    Type: String
  DgtClientSecret:
    Type: String
    NoEcho: true
  JobcardPingClientId:
    Type: String
    Description: PingFederate client id dedicated to jobcard (scope prd:dgt)
  JobcardPingClientSecret:
    Type: String
    NoEcho: true
    Description: PingFederate client secret dedicated to jobcard (scope prd:dgt)

  # ── MoparDoc (job-docs connector + MoparDocs Browser API) ─────────────────
  MoparDocPingClientId:
    Type: String
    Description: PingFederate client id dedicato a moparDoc (scope prd:mdo)
  MoparDocPingClientSecret:
    Type: String
    NoEcho: true
    Description: PingFederate client secret dedicato a moparDoc (scope prd:mdo)
  MoparDocIbmClientId:
    Type: String
    NoEcho: true
    Description: X-IBM-Client-Id per job-docs connector e MoparDocs Browser API
  MoparDocIbmClientSecret:
    Type: String
    NoEcho: true
    Description: X-IBM-Client-Secret per job-docs connector e MoparDocs Browser API

  # ── V360 (ASV API) ────────────────────────────────────────────────────────
  AsvClientId:
    Type: String
  AsvClientSecret:
    Type: String
    NoEcho: true
  AsvGetDetailsClientId:
    Type: String
    Description: Default clientId used in getdetails request body when not provided in input (environment-specific)
  V360PingClientId:
    Type: String
    Description: PingFederate client id dedicated to v360 (scope prd:asv)
  V360PingClientSecret:
    Type: String
    NoEcho: true
    Description: PingFederate client secret dedicated to v360 (scope prd:asv)

  # ── pkEper (WsIQPckEper SOAP — FCA/Stellantis) ────────────────────────────
  EperHost:
    Type: String
  EperCoddealer:
    Type: String
  EperCodmarket:
    Type: String
  EperLingua:
    Type: String
    Default: IT

  # ── pkDocsoa (PSA/Stellantis) ─────────────────────────────────────────────
  DocsoaHost:
    Type: String
  DocsoaUsername:
    Type: String
  DocsoaPassword:
    Type: String
    NoEcho: true
  DocsoaIbmClientId:
    Type: String
    NoEcho: true
  DocsoaIbmClientSecret:
    Type: String
    NoEcho: true
  DocsoaCodbrand:
    Type: String
  DocsoaLangue:
    Type: String
  DocsoaPays:
    Type: String
  DocsoaCodepdv:
    Type: String

  # ── pkMenupricing (Opel/Vauxhall SOAP) ────────────────────────────────────
  MenupricingWsdl:
    Type: String
  MenupricingUsr:
    Type: String
  MenupricingPws:
    Type: String
    NoEcho: true
  MenupricingUsrReq:
    Type: String
  MenupricingPwsReq:
    Type: String
    NoEcho: true
  MpLanguageCode:
    Type: String
  MpCountryCode:
    Type: String
  MpDealerIdentificationCode:
    Type: String
  MpManufacturer:
    Type: String

  # ── myPeople (IURSMA readUserProfiles — PSA/Stellantis) ──────────────────
  MyPeopleHost:
    Type: String
    Default: https://api-basic-preprod.groupe-psa.com
  MyPeopleIbmClientId:
    Type: String
    NoEcho: true
  MyPeopleUsername:
    Type: String
    NoEcho: true
  MyPeoplePassword:
    Type: String
    NoEcho: true
  MyPeopleIdentifier:
    Type: String
    NoEcho: true
    Description: Fixed identifier value required by the readUserProfiles API (constant, not a per-call input)
  MyPeopleCertSecretId:
    Type: String
    Default: apicCert
    Description: Secrets Manager secret id holding the mTLS client certificate (PEM)
  MyPeopleKeySecretId:
    Type: String
    Default: apicKey
    Description: Secrets Manager secret id holding the mTLS client private key (PEM)
  MyPeopleExtensionLayerArn:
    Type: String
    Default: arn:aws:lambda:eu-west-1:015030872274:layer:AWS-Parameters-and-Secrets-Lambda-Extension:90
    Description: >-
      ARN of the AWS Parameters and Secrets Lambda Extension layer (pinned instead of a versionless
      SSM dynamic reference, because the deploy role lacks ssm:GetParameters on the public parameter).
      Bump this when AWS publishes a newer version — see
      https://docs.aws.amazon.com/systems-manager/latest/userguide/ps-integration-lambda-extensions.html#intel

  # ── pkFavorite (pacchetti/forfait preferiti del dealer per VIN — Aurora PostgreSQL) ──
  PkFavoriteDbHost:
    Type: String
    Description: >-
      Endpoint del database (consigliato: l'endpoint dell'RDS Proxy, es.
      rdsproxy-np-bsn0027990-<env>.proxy-xxxx.eu-west-1.rds.amazonaws.com, NON l'endpoint
      diretto del cluster Aurora, per beneficiare del pooling di connessioni verso le Lambda)
  PkFavoriteDbPort:
    Type: String
    Default: '5432'
  PkFavoriteDbName:
    Type: String
    Default: wiadvisor
  PkFavoriteDbSecretId:
    Type: String
    Default: sm-np-bsn0027990-dev-aurora-app
    Description: >-
      Secrets Manager secret id con le credenziali least-privilege (username/password)
      dell'utente applicativo Aurora ("wiadvisor_app"), letto tramite la AWS Parameters
      and Secrets Lambda Extension (stesso meccanismo di MyPeopleCertSecretId/MyPeopleKeySecretId)

# ── Conditions ─────────────────────────────────────────────────────────────────

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

# ── Globals ───────────────────────────────────────────────────────────────────

Globals:
  Function:
    Runtime: nodejs24.x
    # 128MB (default AWS) assegna una frazione minima di vCPU: penalizza pesantemente
    # le operazioni CPU-bound (handshake TLS verso RDS Proxy, PingFederate, gateway
    # DML/DMS/job-docs — quest'ultime spesso multiple e in parallelo per singola
    # invocazione). Portato a 1024MB (vCPU quasi intera) per ridurre ulteriormente
    # le latenze percepite (es. GET pkfavorite con più preferiti, che combina
    # lettura DB + N chiamate DMS parallele).
    MemorySize: 1024
    Timeout: 30
    Tracing: Active
    Handler: index.handler
    VpcConfig:
      SubnetIds: !Ref VpcSubnetIds
      SecurityGroupIds: !Ref VpcSecurityGroupIds
    PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/StlaPermissionBoundary'

# ── Resources ─────────────────────────────────────────────────────────────────

Resources:

  AgendaSoaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-agendasoa"
      CodeUri: agendaSoa/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - S3ReadPolicy:
            BucketName: !Ref TranslationsBucket
      Environment:
        Variables:
          AGENDA_SOA_HOST:     !Ref AgendaSoaHost
          AGENDA_SOA_USERNAME: !Ref AgendaSoaUsername
          AGENDA_SOA_PASSWORD: !Ref AgendaSoaPassword
          AGENDA_SOA_API_KEY:  !Ref AgendaSoaApiKey
          AGENDA_SOA_CERT_BUCKET: !Ref TranslationsBucket
          AGENDA_SOA_CERT:     !Ref AgendaSoaCertKey
          AGENDA_SOA_KEY:      !Ref AgendaSoaKeyKey

  AgendaSoaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AgendaSoaFunction}"
      RetentionInDays: 30

  AgendaSoaNagaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-agendasoanaga"
      CodeUri: agendaSoaNaga/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - S3ReadPolicy:
            BucketName: !Ref TranslationsBucket
      Environment:
        Variables:
          AGENDA_SOA_HOST:     !Ref AgendaSoaHost
          AGENDA_SOA_USERNAME: !Ref AgendaSoaUsername
          AGENDA_SOA_PASSWORD: !Ref AgendaSoaPassword
          AGENDA_SOA_API_KEY:  !Ref AgendaSoaApiKey
          AGENDA_SOA_CERT_BUCKET: !Ref TranslationsBucket
          AGENDA_SOA_CERT:     !Ref AgendaSoaCertKey
          AGENDA_SOA_KEY:      !Ref AgendaSoaKeyKey

  AgendaSoaNagaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AgendaSoaNagaFunction}"
      RetentionInDays: 30

  DmsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-dms"
      CodeUri: dms/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Environment:
        Variables:
          DMS_PING_CLIENT_ID:     !Ref DmsPingClientId
          DMS_PING_CLIENT_SECRET: !Ref DmsPingClientSecret
          DML_IBM_CLIENT_ID:    !Ref DmlIbmClientId
          DML_IBM_CLIENT_SECRET: !Ref DmlIbmClientSecret
          DML_X_TARGET_ENV:     !Ref DmlXTargetEnv

  DmsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DmsFunction}"
      RetentionInDays: 30

  JobCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-jobcard"
      CodeUri: jobcard/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Environment:
        Variables:
          JOBCARD_PING_CLIENT_ID:     !Ref JobcardPingClientId
          JOBCARD_PING_CLIENT_SECRET: !Ref JobcardPingClientSecret
          DGT_CLIENT_ID:      !Ref DgtClientId
          DGT_CLIENT_SECRET:  !Ref DgtClientSecret

  JobCardFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${JobCardFunction}"
      RetentionInDays: 30

  # DjcFunction: declinazione di JobCardFunction (Digital Job Card). Espone
  # l'azione "saveJobcard" (POST /jobCard) e riusa lo stesso client
  # PingFederate/DGT di jobcard, quindi condivide gli stessi parametri
  # JobcardPingClientId/Secret e DgtClientId/Secret.
  DjcFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-djc"
      CodeUri: djc/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Environment:
        Variables:
          JOBCARD_PING_CLIENT_ID:     !Ref JobcardPingClientId
          JOBCARD_PING_CLIENT_SECRET: !Ref JobcardPingClientSecret
          DGT_CLIENT_ID:      !Ref DgtClientId
          DGT_CLIENT_SECRET:  !Ref DgtClientSecret

  DjcFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DjcFunction}"
      RetentionInDays: 30

  # MoparDocFunction: gestisce createJobCard/createAccessToken (job-docs
  # connector PSA), getUploadDocURL e uploadedDoc (MoparDocs Browser API
  # FCA/Fiat). Usa un client PingFederate dedicato (scope prd:mdo,
  # credenziali diverse da jobcard/djc) e credenziali IBM API Connect proprie.
  MoparDocFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-mopardoc"
      CodeUri: moparDoc/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Environment:
        Variables:
          MOPARDOC_PING_CLIENT_ID:     !Ref MoparDocPingClientId
          MOPARDOC_PING_CLIENT_SECRET: !Ref MoparDocPingClientSecret
          MOPARDOC_IBM_CLIENT_ID:      !Ref MoparDocIbmClientId
          MOPARDOC_IBM_CLIENT_SECRET:  !Ref MoparDocIbmClientSecret

  MoparDocFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MoparDocFunction}"
      RetentionInDays: 30

  V360Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-v360"
      CodeUri: v360/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Environment:
        Variables:
          V360_PING_CLIENT_ID:     !Ref V360PingClientId
          V360_PING_CLIENT_SECRET: !Ref V360PingClientSecret
          ASV_CLIENT_ID:      !Ref AsvClientId
          ASV_CLIENT_SECRET:  !Ref AsvClientSecret
          ASV_GETDETAILS_CLIENT_ID: !Ref AsvGetDetailsClientId

  V360FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${V360Function}"
      RetentionInDays: 30

  # ── srpV360Ota (OTA Compatibility BFF — credenziali da SSM/Secrets Manager) ──
  #
  # Lambda indipendente dal modulo v360 a livello di codice sorgente.
  # Le credenziali PingFederate e IBM API Connect sono recuperate a runtime
  # da Secrets Manager (ARN letto da un parametro SSM), stesso pattern di
  # isStellantisBrand per il database.
  SrpV360OtaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-srpv360ota"
      CodeUri: srpV360Ota/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub
                  - "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPath}"
                  - ParamPath: !If [IsProd, "/app/BSN0027990/SRP_V360_OTA", !Sub "/app/np-BSN0027990-${Environment}/SRP_V360_OTA"]
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: "*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
      Environment:
        Variables:
          SRP_V360_OTA_SECRET_ARN_PARAM: !If
            - IsProd
            - /app/BSN0027990/SRP_V360_OTA
            - !Sub /app/np-BSN0027990-${Environment}/SRP_V360_OTA

  SrpV360OtaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SrpV360OtaFunction}"
      RetentionInDays: 30

  PkEperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-pkeper"
      CodeUri: pkEper/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Environment:
        Variables:
          EPER_HOST: !Ref EperHost

  PkEperFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PkEperFunction}"
      RetentionInDays: 30

  # Il certificato/chiave mTLS ("apicCert"/"apicKey", gli STESSI usati da myPeople)
  # sono letti da AWS Secrets Manager tramite la AWS Parameters and Secrets Lambda
  # Extension (layer), esattamente come in MyPeopleFunction. La funzione gira in
  # VPC (Globals.Function.VpcConfig): è necessario un endpoint di rete verso
  # Secrets Manager (VPC Interface Endpoint o NAT Gateway).
  PkDocsoaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-pkdocsoa"
      CodeUri: pkDocsoa/
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleCertSecretId}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleKeySecretId}-*"
      Environment:
        Variables:
          DOCSOA_HOST:              !Ref DocsoaHost
          DOCSOA_USERNAME:          !Ref DocsoaUsername
          DOCSOA_PASSWORD:          !Ref DocsoaPassword
          DOCSOA_IBM_CLIENT_ID:     !Ref DocsoaIbmClientId
          DOCSOA_IBM_CLIENT_SECRET: !Ref DocsoaIbmClientSecret
          DOCSOA_CERT_SECRET_ID:    !Ref MyPeopleCertSecretId
          DOCSOA_KEY_SECRET_ID:     !Ref MyPeopleKeySecretId

  PkDocsoaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PkDocsoaFunction}"
      RetentionInDays: 30

  PkMenupricingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-pkmenupricing"
      CodeUri: pkMenupricing/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Environment:
        Variables:
          MENUPRICING_WSDL:    !Ref MenupricingWsdl
          MENUPRICING_USR:     !Ref MenupricingUsr
          MENUPRICING_PWS:     !Ref MenupricingPws
          MENUPRICING_USR_REQ: !Ref MenupricingUsrReq
          MENUPRICING_PWS_REQ: !Ref MenupricingPwsReq

  PkMenupricingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PkMenupricingFunction}"
      RetentionInDays: 30

  # ── Translations (bucket S3 + Lambda) ──────────────────────────────────────

  TranslationsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "s3-np-bsn0027990-${Environment}-translations"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  TranslationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-translations"
      CodeUri: translations/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - S3ReadPolicy:
            BucketName: !Ref TranslationsBucket
      Environment:
        Variables:
          TRANSLATIONS_BUCKET_NAME: !Ref TranslationsBucket

  TranslationsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${TranslationsFunction}"
      RetentionInDays: 30

  PkManagerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-pkmanager"
      CodeUri: ./
      Handler: pkManager/index.handler
      # pkDocsoa (imbarcato in-process via Makefile) richiede l'estensione Lambda +
      # il permesso Secrets Manager per il proprio mTLS (certificato/chiave "apicCert"/"apicKey",
      # gli STESSI usati da myPeople) — vedi PkDocsoaFunction/MyPeopleFunction.
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleCertSecretId}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleKeySecretId}-*"
      Environment:
        Variables:
          EPER_HOST:                    !Ref EperHost
          EPER_CODDEALER:               !Ref EperCoddealer
          EPER_CODMARKET:                !Ref EperCodmarket
          EPER_LINGUA:                  !Ref EperLingua
          DOCSOA_HOST:                  !Ref DocsoaHost
          DOCSOA_USERNAME:              !Ref DocsoaUsername
          DOCSOA_PASSWORD:              !Ref DocsoaPassword
          DOCSOA_IBM_CLIENT_ID:         !Ref DocsoaIbmClientId
          DOCSOA_IBM_CLIENT_SECRET:     !Ref DocsoaIbmClientSecret
          DOCSOA_CERT_SECRET_ID:        !Ref MyPeopleCertSecretId
          DOCSOA_KEY_SECRET_ID:         !Ref MyPeopleKeySecretId
          DOCSOA_CODBRAND:              !Ref DocsoaCodbrand
          DOCSOA_LANGUE:                !Ref DocsoaLangue
          DOCSOA_PAYS:                  !Ref DocsoaPays
          DOCSOA_CODEPDV:               !Ref DocsoaCodepdv
          MENUPRICING_WSDL:             !Ref MenupricingWsdl
          MENUPRICING_USR:              !Ref MenupricingUsr
          MENUPRICING_PWS:              !Ref MenupricingPws
          MENUPRICING_USR_REQ:          !Ref MenupricingUsrReq
          MENUPRICING_PWS_REQ:          !Ref MenupricingPwsReq
          MP_LANGUAGE_CODE:             !Ref MpLanguageCode
          MP_COUNTRY_CODE:              !Ref MpCountryCode
          MP_DEALER_IDENTIFICATION_CODE: !Ref MpDealerIdentificationCode
          MP_MANUFACTURER:              !Ref MpManufacturer
          DMS_PING_CLIENT_ID:           !Ref DmsPingClientId
          DMS_PING_CLIENT_SECRET:       !Ref DmsPingClientSecret
          DML_IBM_CLIENT_ID:            !Ref DmlIbmClientId
          DML_IBM_CLIENT_SECRET:        !Ref DmlIbmClientSecret
          DML_X_TARGET_ENV:             !Ref DmlXTargetEnv

  PkManagerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PkManagerFunction}"
      RetentionInDays: 30

  # SessionFunction impacchetta l'intero repo (CodeUri: ./, BuildMethod: makefile) perché,
  # oltre al proprio codice, richiede in-process myPeople/myPeopleService e dms/authService +
  # dms/dmsService (stesso pattern già usato da PkManagerFunction per dms/pkEper/..., vedi
  # Makefile) per il flusso "evolutivo" username -> myPeople -> dms/settings.
  SessionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-session"
      CodeUri: ./
      Handler: session/src/index.handler
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - S3ReadPolicy:
            BucketName: !Ref TranslationsBucket
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleCertSecretId}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleKeySecretId}-*"
      Environment:
        Variables:
          SESSION_BUCKET_NAME: !Ref TranslationsBucket
          SESSION_DATA_KEY: session/session_data.json
          # myPeople (usato dal flusso username -> myPeople -> dms/settings)
          MYPEOPLE_HOST:            !Ref MyPeopleHost
          MYPEOPLE_IBM_CLIENT_ID:   !Ref MyPeopleIbmClientId
          MYPEOPLE_USERNAME:        !Ref MyPeopleUsername
          MYPEOPLE_PASSWORD:        !Ref MyPeoplePassword
          MYPEOPLE_IDENTIFIER:      !Ref MyPeopleIdentifier
          MYPEOPLE_CERT_SECRET_ID:  !Ref MyPeopleCertSecretId
          MYPEOPLE_KEY_SECRET_ID:   !Ref MyPeopleKeySecretId
          # dms (usato dallo stesso flusso, per dms/settings)
          DMS_PING_CLIENT_ID:       !Ref DmsPingClientId
          DMS_PING_CLIENT_SECRET:   !Ref DmsPingClientSecret
          DML_IBM_CLIENT_ID:        !Ref DmlIbmClientId
          DML_IBM_CLIENT_SECRET:    !Ref DmlIbmClientSecret
          DML_X_TARGET_ENV:         !Ref DmlXTargetEnv

  SessionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SessionFunction}"
      RetentionInDays: 30

  # ── myPeople (IURSMA readUserProfiles) ────────────────────────────────────
  #
  # Il certificato/chiave mTLS ("apicCert"/"apicKey") sono letti da AWS Secrets
  # Manager tramite la AWS Parameters and Secrets Lambda Extension (layer),
  # per non dover imbarcare l'SDK e per beneficiare della cache locale
  # dell'estensione. La funzione gira in VPC (Globals.Function.VpcConfig):
  # è necessario un endpoint di rete verso Secrets Manager (VPC Interface
  # Endpoint o NAT Gateway) affinché l'estensione riesca a recuperare i segreti.
  MyPeopleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-mypeople"
      CodeUri: myPeople/
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleCertSecretId}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MyPeopleKeySecretId}-*"
      Environment:
        Variables:
          MYPEOPLE_HOST:            !Ref MyPeopleHost
          MYPEOPLE_IBM_CLIENT_ID:   !Ref MyPeopleIbmClientId
          MYPEOPLE_USERNAME:        !Ref MyPeopleUsername
          MYPEOPLE_PASSWORD:        !Ref MyPeoplePassword
          MYPEOPLE_IDENTIFIER:      !Ref MyPeopleIdentifier
          MYPEOPLE_CERT_SECRET_ID:  !Ref MyPeopleCertSecretId
          MYPEOPLE_KEY_SECRET_ID:   !Ref MyPeopleKeySecretId

  MyPeopleFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MyPeopleFunction}"
      RetentionInDays: 30

  # ── pkFavorite (pacchetti/forfait preferiti del dealer per VIN) ───────────
  #
  # GET  -> elenca i preferiti di un dealer (username, da authorizer.sub) per un VIN,
  #         arricchiti con i dati DML (Code/PackageDescription/PartsAvailablity/
  #         TotalPriceInclTax/TotalPriceExclTax) via dms/dmsService::postDmsInquiry
  #         (MessageType LFP, una chiamata per ciascun codice pacchetto preferito)
  # POST -> crea il preferito se non esiste, altrimenti lo elimina ("toggle")
  # Tabella PKFAVORITE su Aurora PostgreSQL "wiadvisor" (vedi sql/create_tables.sql).
  # Le credenziali dell'utente applicativo Aurora least-privilege ("wiadvisor_app")
  # sono lette da Secrets Manager tramite la AWS Parameters and Secrets Lambda
  # Extension (layer), stesso meccanismo già usato da myPeople/pkDocsoa/session.
  # La funzione gira in VPC (Globals.Function.VpcConfig): il Security Group Lambda
  # deve avere accesso in ingresso consentito sul Security Group dell'RDS Proxy
  # (porta 5432), come già configurato per le altre Lambda del progetto.
  # CodeUri: ./ + BuildMethod: makefile perché index.js richiede in-process
  # dms/authService + dms/dmsService (stesso pattern di PkManagerFunction/
  # SessionFunction, vedi Makefile) per la chiamata al gateway DML.
  PkFavoriteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-pkfavorite"
      CodeUri: ./
      Handler: pkFavorite/index.handler
      Layers:
        - !Ref MyPeopleExtensionLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${PkFavoriteDbSecretId}-*"
            # Il secret è cifrato con una chiave KMS gestita dal cliente (non la
            # default aws/secretsmanager): senza kms:Decrypt la Lambda Parameters
            # and Secrets Extension fallisce con "HTTP 400 - an unexpected error
            # occurred while executing request" (stesso problema già risolto per
            # isStellantisBrand).
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
      Environment:
        Variables:
          PKFAVORITE_DB_HOST:      !Ref PkFavoriteDbHost
          PKFAVORITE_DB_PORT:      !Ref PkFavoriteDbPort
          PKFAVORITE_DB_NAME:      !Ref PkFavoriteDbName
          PKFAVORITE_DB_SECRET_ID: !Ref PkFavoriteDbSecretId
          # dms/config.js (in-process, vedi Makefile) — gateway DML per l'arricchimento
          # dei preferiti (MessageType LFP), stessi valori usati da PkManagerFunction.
          DMS_PING_CLIENT_ID:    !Ref DmsPingClientId
          DMS_PING_CLIENT_SECRET: !Ref DmsPingClientSecret
          DML_IBM_CLIENT_ID:     !Ref DmlIbmClientId
          DML_IBM_CLIENT_SECRET: !Ref DmlIbmClientSecret
          DML_X_TARGET_ENV:      !Ref DmlXTargetEnv

  PkFavoriteFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PkFavoriteFunction}"
      RetentionInDays: 30

  # ── isStellantisBrand (Aurora via RDS Proxy) ──────────────────────────────

  IsStellantisBrandFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lmb-np-bsn0027990-${Environment}-isstellantisbrand"
      CodeUri: isStellantisBrand/
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub
                  - "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPath}"
                  - ParamPath: !If [IsProd, "/app/BSN0027990/DB_SECRET_ARN", !Sub "/app/np-BSN0027990-${Environment}/DB_SECRET_ARN"]
                - !Sub
                  - "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPath}"
                  - ParamPath: !If [IsProd, "/app/BSN0027990/RDS_PROXY_ENDPOINT", !Sub "/app/np-BSN0027990-${Environment}/RDS_PROXY_ENDPOINT"]
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: "*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
      Environment:
        Variables:
          DB_SECRET_ARN_PARAM: !If
            - IsProd
            - /app/BSN0027990/DB_SECRET_ARN
            - !Sub /app/np-BSN0027990-${Environment}/DB_SECRET_ARN
          RDS_PROXY_ENDPOINT_PARAM: !If
            - IsProd
            - /app/BSN0027990/RDS_PROXY_ENDPOINT
            - !Sub /app/np-BSN0027990-${Environment}/RDS_PROXY_ENDPOINT

  IsStellantisBrandFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${IsStellantisBrandFunction}"
      RetentionInDays: 30

# ── Outputs ───────────────────────────────────────────────────────────────────

Outputs:
  AgendaSoaFunctionArn:
    Value: !GetAtt AgendaSoaFunction.Arn
  AgendaSoaNagaFunctionArn:
    Value: !GetAtt AgendaSoaNagaFunction.Arn
  DmsFunctionArn:
    Value: !GetAtt DmsFunction.Arn
  JobCardFunctionArn:
    Value: !GetAtt JobCardFunction.Arn
  DjcFunctionArn:
    Value: !GetAtt DjcFunction.Arn
  MoparDocFunctionArn:
    Value: !GetAtt MoparDocFunction.Arn
  V360FunctionArn:
    Value: !GetAtt V360Function.Arn
  SrpV360OtaFunctionArn:
    Value: !GetAtt SrpV360OtaFunction.Arn
  PkEperFunctionArn:
    Value: !GetAtt PkEperFunction.Arn
  PkDocsoaFunctionArn:
    Value: !GetAtt PkDocsoaFunction.Arn
  PkMenupricingFunctionArn:
    Value: !GetAtt PkMenupricingFunction.Arn
  PkManagerFunctionArn:
    Value: !GetAtt PkManagerFunction.Arn
  TranslationsBucketName:
    Value: !Ref TranslationsBucket
  TranslationsFunctionArn:
    Value: !GetAtt TranslationsFunction.Arn
